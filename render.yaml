services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    plan: free
    dockerBuildCommand: ./mvnw -B --no-transfer-progress -DskipTests package
    # Build image then start Java from the built JAR
    startCommand: java -jar target/ecommerce-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/v1/v3/api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev,render
      - key: OTP_EXPOSE_IN_RESPONSE
        value: "true"
