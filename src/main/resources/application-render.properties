# Render.com profile: ephemeral file-based H2 so the demo app needs no external database.
# Free-tier instances get a fresh filesystem per cold start; the dev-profile seeder repopulates all demo data on boot.
spring.datasource.url=jdbc:h2:file:./data/liquefied;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Exchange rates (provider is external; anchor is fixed INR)
app.currency.anchor=INR
app.currency.rate-provider=frankfurter
