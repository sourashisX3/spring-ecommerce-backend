spring.profiles.active=dev
spring.application.name=ecommerce-backend

server.port=${PORT:8083}
server.servlet.context-path=/api/v1

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=sourashis
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration (use create-drop for dev, update/validate for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=ecommerce-backend-secret-key-2026-this-must-be-at-least-256-bits-long-for-hs256
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.storage.local.directory=${UPLOAD_DIR:./uploads}

# Rate Limiting
ratelimit.auth.login.limit=10
ratelimit.auth.login.window=1m
ratelimit.auth.register.limit=10
ratelimit.auth.register.window=1m
ratelimit.auth.send-otp.limit=5
ratelimit.auth.send-otp.window=1m
ratelimit.api.authenticated.limit=300
ratelimit.api.authenticated.window=1m
ratelimit.api.public.limit=60
ratelimit.api.public.window=1m
ratelimit.auth.refresh.limit=60
ratelimit.auth.refresh.window=1m

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG


otp.expose-in-response=${OTP_EXPOSE_IN_RESPONSE:false}
