name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Docker build
        run: |
          docker build -t ecommerce-backend-test .
          docker run -p 8083:8083 ecommerce-backend-test java -jar target/ecommerce-backend-0.0.1-SNAPSHOT.jar &
          sleep 5
          curl -s http://localhost:8083/api/v1/v3/api-docs || echo "Service not ready yet"